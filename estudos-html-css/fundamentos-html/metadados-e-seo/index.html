<!DOCTYPE html>

<!-- lang: Informa o Idioma Padrão da Página -->
<html lang="pt-br">

    <!-- head: Informações sobre a Página (Títulos, Metadados, Favicon e links de Recursos) -->
    <head>

        <!-- Define a Codificação de Caracteres como (ã, ç, é) -->
        <meta charset="UTF-8">

        <!-- viewport: Como o Navegador se Comporta na Área Vísivel da Página -->
        <!-- width=device-width: Faz a Largura da Página Acompanhar a Largura do Dispositivo -->
        <!-- initial-scale=1.0: Define a Escala Inicial como 100% -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- title: Titulo da Página na Aba do Navegador -->
        <title>Document</title>

        <!-- description: Descrição Resumida Sobre o Assunto da Página -->
        <meta name="description" content="Estudos de Metadados e SEO">

        <!-- author: Informa quem Criou a Página -->
        <meta name="author" content="Kayk">

        <!-- link: Estabelece uma Relação entre o Documento e um Recurso Externo -->
        <!-- style.css: Arquivo Associado ao CSS da Página -->
        <link rel="stylesheet" href="style.css">

        <!-- script.js: Conect um Arquivo Javascript Externo á Pagina -->
        <script src="script.js"></script>

        <!-- favicon: Adiciona uma foto de "Perfil" da Página -->
        <link rel="icon" href="favicon.ico">

        <!-- theme-color: Cor de Tema Usado pelo Navegador em Contextos Compativeis -->
        <meta name="theme-color" content="#111827">
    </head>
<body>
    
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessibilidade</title>
</head>
<body>
    
    <!-- # no href para o navegador ir direto na sessão da página com esse id -->
    <a href="#conteudo">Pular para o conteúdo</a>

    <main id="conteudo">
        <h1>Produtos</h1>

        <!-- X como Semiótica de Fechar -->
        <button type="button" aria-label="Fechar menu">×</button>

        <!-- alt: Texto Alternativo Caso a Imagem não abra -->
        <img src="produto.jpg" alt="Tênis preto com sola branca">
        <p>
            <!-- Sessão de Pesquisar -->
            <label for="ibusca">Buscar</label>
            <input id="ibusca" type="search">
        </p>
    </main>
</body>
</html>

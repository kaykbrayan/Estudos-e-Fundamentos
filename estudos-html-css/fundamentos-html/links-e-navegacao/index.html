<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links e Navegação</title>
</head>
<body>
    
    <!-- Link Externo -->
    <a href="https://developer.mozilla.org/">MDN</a>

    <!-- Target_blank Abre uma Nova Aba no Navegador -->
    <a href="https://developer.mozilla.org/" target="_blank">MDN</a>

    <!-- Link Interno (Página Dentro do Projeto) -->
    <a href="contato.html">Contato</a>

    <!-- Leva o Usuário até o ID correspondente do Site -->
    <a href="#sobre">Ir para Sobre</a>

    <!-- Abre o EMAIL com o Destinatário Preenchido -->
    <a href="mailto:contato@example.com">Enviar e-mail</a>

    <!-- Abre o Aplicativo de Telefone com o Número Indicado -->
    <a href="tel:+5581999999999">Ligar</a>

    <!-- Sugere que o Navegador Baixe o Arquivo Indicado pelo Link -->
    <a href="arquivo.pdf" download>Baixar PDF</a>

    <!-- "Nav" Organiza a Sessão de Links de Navegação -->
    <nav aria-label="Navegação principal">...</nav>

    <!-- "Aria-label" Identifica a Finalidade de um Elemento no Código -->
    <nav aria-label="Navegação principal"></nav>

    <!-- Identifica qual Link Representa a Página Atual -->
    <a href="index.html" aria-current="page">Início</a>

    <!-- "Noopener" Impede que a Página Aberta Controle a Página Original -->
    <a href="https://developer.mozilla.org/" target="_blank" rel="noopener">MDN</a>

    <!-- "Noopener noreferrer" Impede que a Página Aberta Saiba de Onde o Usuário Veio -->
    <a href="https://developer.mozilla.org/" target="_blank" rel="noopener noreferrer">MDN</a>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semântica e Estrutura da Página</title>
</head>
<body>
    
    <!-- header: Agrupa o Cabeçalho da Página (Topo da Página) -->
    <header>
        <h1>Header do Site</h1>
        <p>Descrição</p>
    </header>

    <!-- nav: Agrupa a Sessão de Navegação da Página (Links) -->
    <nav>
        <a href="#">Ínicio</a>
        <a href="#">Sobre</a>
        <a href="#">Contatos</a>
    </nav>

    <!-- main: Agrupa o Conteúdo Principal da Página -->
    <main>

        <!-- article: Agrupa Conteúdo Independente (Artigos, Notícias e Publicações) -->
        <article>
            <header>
                <h1>Como Estudas HTML</h1>
                <p>Publicado em <time datetime="01-01-19"></time>01/01/19</p>
            </header>

            <!-- section: Agrupa Conteúdos Relacionados a uma Sessão Temática -->
            <section>
                <h2>Introdução</h2>
                <p>Conteúdo do Artigo.</p>
            </section>
        </article>

        <!-- aside: Agrupa um Conteúdo Complementar da Página -->
        <aside>
            <h2>Conteúdo Relacionado</h2>
        </aside>
    </main>

    <!-- footer: Agrupa o Rodapé da Página -->
    <footer>
        <p>&copy; 2026 Meu Site</p>
    </footer>

<!-- ----------- OUTRAS TAGS SEMÂNTICAS ----------- -->

    <!-- div: Agrupa Conteúdos sem Elemento Semântico mais Adequado -->
    <div>
        <p>Div</p>
    </div>

    <!-- span: Agrupa Uma Linha sem Semântica Específica (Linha Única) -->
    <span><p>Span</p></span>

    <!-- search: Identifica que o Texto é uma Busca -->
    <search>Busca</search>

    <!-- address: Identifica que o Texto é um Contato (Pessoa, Empresa...) -->
    <address><a href="mailto:contato@exemplo.com">Contato</a></address>
</body>
</html>

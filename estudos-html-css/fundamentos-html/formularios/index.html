<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    
    <!-- get: Mostra os dados na URL -->
    <form action="envio.php" method="get"></form>

    <!-- form: Cria os formulários -->
    <!-- action: Define para onde os Dados vão -->
    <!-- method: Qual o metodo será usado, Mostrar ou Não os Dados na URL -->
    <!-- post: Esconde os dados na URL -->
    <form action="envio.php" method="post">

        <!-- fieldset: Cria uma sessão na tabela com borda -->
        <fieldset>
            <!-- legend: Cria um Título na Borda do Fieldset -->
            <legend>Cadastro</legend>

            <!-- "p" ou "div" para agrupar a sessão -->
            <p>
                <!-- label: Para Identifica um Campo do Formulário -->
                <!-- for: Associa ao Campo com um "id" de um input -->

                <!-- input: Local onde o Usuário Insere um Dado -->
                <!-- type: Tipo do Input -->
                <!-- "text": Input do Tipo Texto -->

                <!-- name: Nome do Campo Enviado ao Servidor -->
                <!-- id: Identifica um Elemento Individualmente (Associado ao Label) -->

                <!-- autocomplete: Sugere Completar com Base nos seus Últimos dados Referentes a Área -->
                <!-- type "name": Sugere Nomes já preenchidos no Navegador -->

                <!-- required: Deixa a Sessão Obrigatória -->

                <label for="inome">Nome</label>
                <input type="text" name="nome" id="inome" autocomplete="name" required>
            </p>

            <p>
                <!-- type "email": Input do tipo Email -->
                <!-- autocomplete "email": Sugere Emails já preenchidos no Navegador -->
                <!-- placeholder: Texto com Pouca Opacidade Dentro do Input -->
                <label for="iemail">Email</label>
                <input type="email" name="email" id="iemail" autocomplete="email" placeholder="exemplo@gmail.com" required>
            </p>

            <p>
                <!-- type "password": Input do tipo Senha -->
                <!-- minlength: Define Quantidade de Caracteres Mínimo Permitida -->
                <!-- maxlength: Define Quantidade de Caracteres Máximo Permitida -->
                <label for="isenha">Senha</label>
                <input type="password" name="senha" id="isenha" minlength="8" maxlength="20" required>
            </p>

            <p>
                <!-- type "number": Input do tipo Número -->
                <!-- min: Valor Mínimo Permitido -->
                <!-- max: Valor Máximo Permitido -->
                <!-- value: Deixa um valor fixo Inicialmente (Número, Cor...) -->
                <label for="iidade">Idade</label>
                <input type="number" name="idade" id="iidade" min="18" max="100" value="18" required>
            </p>

            <p>
                <!-- type "date": Input do tipo Data (dia/mês/ano) -->
                <label for="idata">Data</label>
                <input type="date" name="data" id="idata">
            </p>

            <p> 
                <!-- type "color": Input do tipo Cor -->
                <label for="icor">Cor</label>
                <input type="color" name="cor" id="icor" value="#00ff00">
            </p>

            <p> 
                <!-- type "file": Input do tipo Arquivo -->
                <!-- accept: Indica os Formatos de Arquivos Permitidos -->
                <label for="iarquivo">Arquivo</label>
                <input type="file" name="arquivo" id="iarquivo" accept=".pdf,image/*">
            </p>

            <p>
                <!-- select: Cria uma Lista Suspensa de Opções -->
                <!-- optgroup: Separa as Opções por Grupos dentro do Select -->
                <!-- option: Cria uma opção dentro do select -->
                <label for="iestados">Estados</label>
                <select name="estados" id="iestados">

                    <optgroup label="Nordeste">
                        <option value="PE">Pernambuco</option>
                    </optgroup>

                    <optgroup label="Sudeste">
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                    </optgroup>

                </select>
            </p>

            <p>
                <!-- list: id de uma Lista Específica -->
                <label for="iprofissao">Profissões</label>
                <input type="text" name="profissao" id="iprofissao" list="listaprofissao">

                <!-- datalist: Cria lista de opções e Permite o Usuário Digitar (relacionado ao List do input) -->
                <datalist id="listaprofissao">
                    <option value="DEV">Desenvolvedor</option>
                    <option value="PF">Policial Federal</option>
                </datalist>
            </p>

            <p> 
                <!-- textarea: Cria uma área de Mensagem -->
                <!-- cols: Largura do Bloco -->
                <!-- rows: Altura do Bloco -->
                <label for="imensagem">Mensagem</label>
                <textarea name="mensagem" id="imensagem" cols="30" rows="10" placeholder="Mensagem aqui..."></textarea>
            </p>

            <p> <!-- type "checkbox": Input do tipo Caixa de Marcação ("check") Permite desmarcar -->
                <input type="checkbox" name="futebol" id="ifutebol">
                <label for="ifutebol">Futebol</label>
                <br>
                <input type="checkbox" name="basquete" id="ibasquete">
                <label for="ibasquete">Basquete</label>
                <br>
                <input type="checkbox" name="volei" id="ivolei">
                <label for="ivolei">Vôlei</label>
            </p>

            <p>
                <!-- type "radio": Input do tipo Círculo de Marcação (Não Permite Desmarcar) -->
                <!-- Obs type "radio":  Todos os label devem ter o mesmo "name" -->
                <input type="radio" name="sexo" id="imasculino">
                <label for="imasculino">Masculino</label>
                <br>
                <input type="radio" name="sexo" id="ifeminino">
                <label for="ifeminino">Feminino</label>
            </p>

            <!-- type "submit": Input do tipo Enviar -->
            <input type="submit" value="Enviar">

            <!-- type "reset": Input do tipo Limpar -->
            <input type="reset" value="Limpar">

            <p>
                <!-- type "tel": Input do tipo Telefone -->
                <label for="itelefone">Telefone</label>
                <input type="tel" name="telefone" id="itelefone" placeholder="(xx) xxxxx-xxxx">
            </p>

            <p>
                <!-- type "url": Input do tipo Link (url) -->
                <label for="isite">Site</label>
                <input type="url" name="site" id="isite" placeholder="https://www.exemplo.com">
            </p>

            <p>
                <!-- type "search": Input do tipo Pesquisar -->
                <label for="ipesquisar">Pesquisar</label>
                <input type="search" name="pesquisar" id="ipesquisar" placeholder="Digite sua pesquisa">
            </p>

            <p>
                <!-- type "time": Input do tipo Horário -->
                <label for="ihorario">Horário</label>
                <input type="time" name="horario" id="ihorario">
            </p>

            <p>
                <!-- type "datetime-local": Input do tipo Data e Horário -->
                <label for="idataehorario">Data e Horário</label>
                <input type="datetime-local" name="dataehorario" id="idataehorario">
            </p>

            <p>
                <!-- type "month": Input do tipo Mês e Ano -->
                <label for="imes">Mês</label>
                <input type="month" name="mes" id="imes">
            </p>

            <p>
                <!-- type "week": Input do tipo Semana do Ano -->
                <label for="isemana">Semana</label>
                <input type="week" name="semana" id="isemana">
            </p>

            <p>
                <!-- type "range": Input do tipo Controle Deslizante -->
                <label for="iavaliacao">Avaliação</label>
                <input type="range" name="avaliacao" id="iavaliacao" min="1" max="10" value="3">
            </p>

            <p>
                <!-- type "hidden": Input Escondido -->
                <input type="hidden" name="codigo" value="1234">
            </p>

            <p>
                <input type="button" value="Clique Aqui">
            </p>

        </fieldset>
    </form>
</body>
</html>

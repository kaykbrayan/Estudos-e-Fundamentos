<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundamentos e Como Fazer</title>
    <!-- link css: Cria um Arquivo Externo de CSS -->
    <!-- href: Indica onde o Arquivo Externo do CSS está -->

    <!-- style: Cria um CSS Interno no HTML (Dentro do head)-->

    </style>
</head>
<body>
    
    <!-- Classificações de títulos -->
    <h1 class="titulo">Olá CSS</h1>
    <p>Extilo aplicado por arquivo externo</p>
</body>
</html>
